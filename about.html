        <p class="py-5" style="text-align: center;"
            data-en="Hey, I’m Marko, from Osijek, Croatia.

            While most guys my age are busy buying hair transplants and sports cars to feel alive, I’m in my garage hammering red-hot steel and cursing at leather that won’t behave. And I fucking love it.

            I make knives because I genuinely enjoy it. All kinds. Big ones, small ones, pretty ones, brutal ones. I turn steel into tools that will outlive their owners and make your kitchen (or your belt) look cooler in the process. 
            
            Wallets? Same story, I hand-stitch full-grain leather so you don’t have to carry around another piece of Chinese crap that falls apart in six months.

            This isn’t a “hobby.” It’s my escape from the modern world of disposable garbage. No shortcuts, no bullshit. Just me, fire, steel, sweat, and the occasional band-aid.

            Every Mad Deer piece is made the old way, slowly and properly. If you’re the kind of person who respects real craftsmanship and doesn’t cry about the price… We’re going to get along great.

            If you want cheap and fast, Amazon is two clicks away. </br></br>

            Welcome to the garage."
            data-hr="Bok, ja sam Marko, iz Osijeka.

            Dok većina likova mojih godina kupuje presađivanje kose i sportske aute da bi se osjećali živima, ja sam u garaži, kujem užareni čelik i psujem kožu koja neće surađivati. I jebeno uživam u tome.

            Radim noževe jer to stvarno volim. Svakakve. Velike, male, lijepe, brutalne. Pretvaram čelik u alate koji će nadživjeti svoje vlasnike i usput učiniti tvoju kuhinju (ili remen) puno boljom.

            Novčanici? Ista priča, ručno šivam punozrnatu kožu da ne moraš nositi još jedno kinesko smeće koje se raspadne za šest mjeseci.

            Ovo nije “hobi”. Ovo je moj bijeg od modernog svijeta jednokratnog sranja. Nema prečaca, nema gluposti. Samo ja, vatra, čelik, znoj i povremeni flaster.

            Svaki Mad Deer komad radi se na stari način, polako i kako treba. Ako si osoba koja cijeni pravo zanatstvo i ne cvili oko cijene… odlično ćemo se slagati.

            Ako želiš jeftino i brzo, Amazon je dva klika dalje. </br></br>

            Dobrodošao u garažu."
        >
